*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0;}
body{background:#12141d;color:#eee;padding:16px;max-width:1240px;margin:0 auto;}
h1{text-align:center;margin-bottom:20px;font-size:22px;}
.box{background:#1e2230;padding:18px;border-radius:12px;margin-bottom:16px;}

.group-box h3{font-size:15px;margin-bottom:8px;color:#90caf9;}

.chart-block h4{margin-bottom:6px;font-size:14px;color:#cbd5e1;}

    <div>

    <div class="res-item">

    </div>

// 分组
const dlRaw = nodeRawList.filter(x=>x.type==="download");
const ulRaw = nodeRawList.filter(x=>x.type==="upload");

// DOM
const pingGroupBtn = document.getElementById("pingGroupBtn");
const dlNodeSelect = document.getElementById("dlNodeSelect");
const ulNodeSelect = document.getElementById("ulNodeSelect");
const dlNodeList = document.getElementById("dlNodeList");
const ulNodeList = document.getElementById("ulNodeList");

const ulCanvas = document.getElementById("ulChart");

const ulCtx = ulCanvas.getContext("2d");

let dlPingList = [];
let ulPingList = [];
let abortController = null;
let dlSpeedPoints = [];
let ulSpeedPoints = [];

function logStatus(s){ statusEl.innerText = "状态："+s; }

// ping单个节点 HEAD
async function pingOne(node){
  const t0 = performance.now();
  try{
    const ac = new AbortController();
    await fetch(node.url, {method:"HEAD", signal:ac.signal, mode:"no-cors"});
    const t1 = performance.now();
    return {ok:true, latency: t1-t0, name:node.name, url:node.url};
  }catch(e){
    return {ok:false, latency:9999, name:node.name, url:node.url};
  }
}

// 绘制通用波形
function drawCurve(ctx, canvas, points, lineColor="#38bdf8"){
  const w = canvas.width;
  const h = canvas.height;
  ctx.fillStyle="#171a27";
  ctx.fillRect(0,0,w,h);
  if(points.length<2) return;
  ctx.strokeStyle = lineColor;
  ctx.lineWidth=2;
  ctx.beginPath();
  const maxV = Math.max(...points) || 1;
  points.forEach((v,i)=>{
    const x = w * (i/(points.length-1));
    const y = h - (v/maxV)*h*0.9;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
}

function clearAllChart(){
  dlSpeedPoints=[];ulSpeedPoints=[];
  drawCurve(dlCtx, dlCanvas, [], "#4ade80");

// ==========【修复下载测速】改用XHR，支持progress事件，解决一次性返回没有分块导致曲线不动 ==========
async function runDownload(url, maxTimeMs){
  return new Promise(resolve=>{
    abortController = new AbortController();
    const xhr = new XMLHttpRequest();
    let totalBytes = 0;
    const tStart = performance.now();
    let lastT = tStart;
    let lastB = 0;
    dlSpeedPoints = [];

    xhr.open("GET", url, true);
    xhr.responseType = "arraybuffer";

    const timerInterval = setInterval(()=>{
      const now = performance.now();
      if(abortController.signal.aborted || (now - tStart)>=maxTimeMs){
        xhr.abort();
      }
    },100);

    xhr.onprogress = (e)=>{
      if(abortController.signal.aborted) return;
      const now = performance.now();
      totalBytes = e.loaded;
      const dt = now - lastT;
      if(dt>200){
        const db = totalBytes - lastB;
        const mbps = (db*8 / 1e6) / (dt/1000);
        dlSpeedPoints.push(mbps);
        drawCurve(dlCtx, dlCanvas, dlSpeedPoints, "#4ade80");
        lastT = now;
        lastB = totalBytes;
      }
    };

    xhr.onloadend = ()=>{
      clearInterval(timerInterval);
      const dur = (performance.now()-tStart)/1000;
      const avg = dur>0 ? (totalBytes*8 /1e6)/dur : 0;
      resolve(avg);
    };

    abortController.signal.addEventListener("abort", ()=>{
      xhr.abort();
    });

    xhr.send();
  });
}

// 上传测速 maxTime ms
async function runUpload(url, maxTimeMs){
  abortController = new AbortController();
  const sig = abortController.signal;
  const blockSize = 128*1024;
  const block = new Uint8Array(blockSize);
  let totalBytes = 0;
  const tStart = performance.now();
  let lastT = tStart; let lastB = 0;
  ulSpeedPoints = [];
  try{
    while(true){
      const now = performance.now();
      if(now - tStart >= maxTimeMs || sig.aborted) break;
      await fetch(url, {method:"POST", body:block, signal:sig, keepalive:false});
      totalBytes += blockSize;
      const dt = now - lastT;
      if(dt>200){
        const db = totalBytes - lastB;
        const mbps = (db*8/1e6)/(dt/1000);
        ulSpeedPoints.push(mbps);
        drawCurve(ulCtx, ulCanvas, ulSpeedPoints, "#facc15");
        lastT = now; lastB = totalBytes;
      }
    }
  }catch(e){}
  const dur = (performance.now()-tStart)/1000;
  return dur>0 ? (totalBytes*8/1e6)/dur :0;
}

startBtn.onclick = async ()=>{
  const dlIdx = dlNodeSelect.value;
  const ulIdx = ulNodeSelect.value;
  if(dlIdx===""||ulIdx===""){
    alert("请先执行【分别Ping下载组&上传组】");
    return;
  }
  startBtn.disabled=true; stopBtn.disabled=false;
  resetResultUi();

  const dlNode = dlPingList[dlIdx];
  const ulNode = ulPingList[ulIdx];
  logStatus(`测速：下载→${dlNode.name}，上传→${ulNode.name}`);

  // 使用下载节点的ping作为显示ping值
  pingVal.innerText = dlNode.latency.toFixed(1);
  jitterVal.innerText = "N/A";

  // 下载30秒
  dlVal.innerText="测试中…";
  const dlAvg = await runDownload(dlNode.url, 30*1000);
  dlVal.innerText = dlAvg.toFixed(2);

  // 上传30秒
  ulVal.innerText="测试中…";
  const ulAvg = await runUpload(ulNode.url,30*1000);
  ulVal.innerText = ulAvg.toFixed(2);

  abortController=null;
  startBtn.disabled=false; stopBtn.disabled=true;
  logStatus("全部测速完成");
};

stopBtn.onclick = ()=>{
  if(abortController) abortController.abort();
  logStatus("手动停止测速");
  stopBtn.disabled=true;
  startBtn.disabled=false;
};

// canvas响应式
function resizeCanvas(){
  const r1 = dlCanvas.getBoundingClientRect();
  dlCanvas.width = r1.width; dlCanvas.height = r1.height;
  const r2 = ulCanvas.getBoundingClientRect();
  ulCanvas.width = r2.width; ulCanvas.height = r2.height;
  clearAllChart();
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

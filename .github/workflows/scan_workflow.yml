name: Github全网扫描IPTV源
on:
  schedule:
    - cron: '0 */2 * * *' # 每2小时执行一次，不要太频繁防止github封号
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git safe dir
        run: git config --global --add safe.directory $PWD

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install package
        run: pip install requests

      - name: run scan script
        run: python scan_iptv.py

      - name: commit file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scaniptv.txt
          git commit -m "🤖自动扫描iptv更新 $(date +'%Y-%m-%d %H:%M')" || echo "无更新跳过提交"
          git push

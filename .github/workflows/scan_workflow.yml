name: IPTV playlist refresh

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-playlist-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and classify playlists
        run: python scan_iptv.py

      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '央视卫视地方直播.txt' '影视线路.txt' '港澳台地区源.txt' '其他.txt' 'iptv_all.txt'
          if git diff --cached --quiet; then
            echo "No playlist changes to commit."
          else
            git commit -m "Refresh categorized IPTV playlists"
            git push
          fi
